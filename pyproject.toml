[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "iigc"
version = "0.1.0"
description = "Information-Induced Gradient Contraction in Partially Observable MARL"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "stable-baselines3>=2.8.0",
    "sb3-contrib>=2.8.0",
    "torch>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
iigc-demo = "iigc.cli_demo:cli_demo"
